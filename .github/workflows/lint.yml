name: lint-and-test

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python3 tools/lint.py --path vault
      - name: pytest (mock llm/embeddings — no secrets needed)
        env:
          THEBRAIN_LLM_MOCK: "1"
        run: python3 -m pytest -q

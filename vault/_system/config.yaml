# TheBrain vault config.
#
# Phase 0 status note is stale as of Phase 1: `llm.py`, `app/common/db.py`,
# the watcher/normalizer/embedder, and the Telegram bot skeleton now read
# this file for real. Nothing in it is a secret — those live in a local
# .env (see .env.example) and are never committed.

llm:
  default:  {provider: anthropic, model: claude-haiku-4-5-20251001}   # verify at docs.claude.com at build time
  strong:   {provider: anthropic, model: claude-sonnet-5}
  escalate: {provider: anthropic, model: claude-opus-4-8}             # on-demand only, not routine
  route_strong_for: [evaluator_deep_report, gap_review_synthesis, metabolism_self_model_pass]

embeddings:
  # "mock" is a deterministic, non-semantic placeholder (app/llm.py) —
  # fine for Phase 1's plumbing (routing, storage, /ask wiring) but not
  # real semantic search. Switch to "ollama" once a worker host exists to
  # run it (docs/00-PLAN.md) — no caller changes needed, same as llm().
  provider: mock
  model: nomic-embed-text
  dim: 768
  ollama_host: http://localhost:11434

coach:
  channel: telegram
  morning_brief: "07:30"
  escalation: on
  intensity: 2               # 1 (gentle) - 3 (firm); tune to taste, see docs/03-engineering-build-spec.md §8.6
  quiet_windows: []          # e.g. [["22:00","07:00"]] — populated from self/current/energy-mood once Phase 2 seeds it

thresholds:
  stale_lead_days: 7
  unbilled_hours_alert: 10

locale:
  country: NL
  currency: EUR
  vat_rate: 21

storage:
  # See docs/00-PLAN.md for the reasoning: Postgres+pgvector via Supabase
  # now, self-hosted on the NAS later. Nothing here yet in Phase 0 — this
  # section gets real values in Phase 1 when the Supabase project exists.
  telemetry: null   # e.g. a Supabase project ref, once created
